[project]
name = "ki-ausschreibungstool"
version = "0.1.0"
description = "KI-gestütztes Ausschreibungstool: Anforderungsanalyse, Referenz-Matching und Faktencheck"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ayoub Khadra" }]
dependencies = [
    "anthropic>=1.17",
    "pydantic>=2.7",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["matching", "demo"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E701", "E702"]

[tool.ruff.lint.isort]
known-first-party = ["ki", "modelle", "pruefungen", "pipeline", "matching"]
