name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Code-Stil prüfen (ruff)
        run: uv run ruff check .
      - name: Tests ausführen (pytest)
        run: uv run pytest
      - name: Demo offline ausführen
        run: uv run demo/pipeline.py --offline
